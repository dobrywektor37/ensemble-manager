
name: Ensemble Manager CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, TypeScript, Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_ALLOW_WRITES: "NO"
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Supabase configuration
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Configure Supabase secrets in GitHub Actions."
            exit 1
          fi

      - name: Check ESLint
        run: npm run lint

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Install Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      # Konfiguracja Playwright wykonuje build Next.js
      # i uruchamia serwer produkcyjny.
      # E2E-09 i E2E-10 pozostają wyłączone w CI.
      - name: Run Playwright E2E
        run: npx playwright test

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

